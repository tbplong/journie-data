[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "journie-data"
version = "0.1.0"
description = "Versioned POI ingestion pipeline for Journie"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "duckdb>=1.3,<2",
  "polars>=1.30,<2",
  "pyarrow>=20,<22",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "selectolax>=0.3,<1",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
geo = ["shapely>=2.1,<3"]
dev = ["mypy>=1.16,<2", "pytest>=8.4,<9", "ruff>=0.12,<1", "types-PyYAML>=6.0,<7"]

[project.scripts]
journie-data = "journie_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/journie_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/journie-llm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["journie_data"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "journie_data.sources.overture",
  "journie_data.sources.osm",
  "journie_data.sources.foursquare",
]
disable_error_code = ["union-attr", "arg-type", "index"]
